services:
  ollama:
    image: ollama/ollama:0.32.14
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OLLAMA_CONTAINER_PORT:-11435}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
        restart: true

volumes:
  ollama-models:
