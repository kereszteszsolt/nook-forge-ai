spring.application.name=nook-forge-api
spring.profiles.default=local

server.address=127.0.0.1

nookforge.api.public-base-url=http://127.0.0.1:8080
nookforge.ai.provider=${AI_PROVIDER:ollama}
nookforge.ai.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
nookforge.ai.model=${OLLAMA_MODEL:llama3.1:8b}
nookforge.ai.request-timeout=${OLLAMA_REQUEST_TIMEOUT:120s}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

server.error.include-binding-errors=never
server.error.include-message=never
server.error.include-stacktrace=never
